<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" class="ill">
  <!-- axes -->
  <line class="ill-axis" x1="90" y1="50" x2="90" y2="252"/>
  <line class="ill-axis" x1="90" y1="252" x2="615" y2="252"/>
  <text class="ill-axis-label" x="82" y="56" text-anchor="end">better</text>
  <text class="ill-axis-label" x="82" y="250" text-anchor="end">worse</text>
  <text class="ill-axis-label" x="352" y="280" text-anchor="middle">time &#8594;</text>

  <!-- the moment the proxy becomes the target -->
  <line class="ill-divider" x1="300" y1="62" x2="300" y2="252"/>
  <text class="ill-note" x="308" y="80">time-to-close becomes</text>
  <text class="ill-note" x="308" y="94">the team&#8217;s target</text>

  <!-- before: the measure is a faithful read on the goal -->
  <path class="ill-shared" d="M90,152 C150,149 240,151 300,150"/>
  <text class="ill-note" x="98" y="212">before, the measure and</text>
  <text class="ill-note" x="98" y="226">the goal move together</text>

  <!-- after: the measure improves -->
  <path class="ill-metric" d="M300,150 C370,122 480,92 588,74"/>
  <circle class="ill-metric-dot" cx="588" cy="74" r="4"/>
  <text class="ill-label ill-label-metric" x="580" y="54" text-anchor="end">time-to-close (the measure)</text>

  <!-- after: the thing it was standing in for gets worse -->
  <path class="ill-goal" d="M300,150 C370,167 480,194 588,212"/>
  <circle class="ill-goal-dot" cx="588" cy="212" r="4"/>
  <text class="ill-label ill-label-goal" x="580" y="234" text-anchor="end">customers actually helped (the goal)</text>
</svg>
